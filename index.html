<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css">
        <title>Movies Catalog</title>
    </head>
    <body>
        <h1 class="text-center my-4">Movies catalog</h1>

        <div class="container">
            <div class="row">
                <div class="col-4">
                    <input
                        type="text"
                        placeholder="ave"
                        class="form-control mb-3"
                        id="search"
                    />
                    <input
                        type="text"
                        placeholder="5"
                        class="form-control mb-3"
                        id="year"
                    />

                    <select name="#" id="janr" class="form-select mb-3">
                        <option value="">All</option>
                    </select>
                    <select name="#" id="rating" class="form-select mb-3">
                        <option value="">Rating (high to low)</option>
                        <option value="9">9+ (Highest)</option>
                        <option value="8">8+ (High)</option>
                        <option value="7">7+ (Good)</option>
                        <option value="6">6+ (Average)</option>
                        <option value="5">5+ (Low)</option>
                    </select>
                    <select name="#" id="size" class="form-select mb-3">
                        <option value="">File Size (any)</option>
                        <option value="tiny">Tiny (< 256MB)</option>
                        <option value="mini">Mini (256-512MB)</option>
                        <option value="small">Small (512MB-1GB)</option>
                        <option value="medium">Medium (1-2GB)</option>
                        <option value="large">Large (2-4GB)</option>
                        <option value="xlarge">Extra Large (> 4GB)</option>
                    </select>

                    <button id="btn" class="btn btn-primary w-100 mb-4">
                        Search
                    </button>

                    <div>
                        <h2 class="h4 mb-3">Bookmarked movies</h2>

                        <ul class="list-group" id="bookmarked-list">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span>Avengers: Infinity War</span>
                                <button class="btn btn-danger btn-sm" onclick="removeBookmark('Avengers: Infinity War')">Remove</button>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span>The Avengers</span>
                                <button class="btn btn-danger btn-sm" onclick="removeBookmark('The Avengers')">Remove</button>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span>12 Years a Slave</span>
                                <button class="btn btn-danger btn-sm" onclick="removeBookmark('12 Years a Slave')">Remove</button>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="col-8">
                    <h3 class="h5 mb-3">
                        Search results: <span id="count">39</span>
                    </h3>

                    <div class="alert alert-info mb-4">
                        Use the form on the left to search for a movie
                    </div>

                    <div class="row" id="main"></div>
                    
                    <!-- Pagination -->
                    <nav aria-label="Movie pagination" class="mt-4">
                        <ul class="pagination justify-content-center" id="pagination">
                            <li class="page-item active"><a class="page-link" href="#">1</a></li>
                            <li class="page-item"><a class="page-link" href="#">2</a></li>
                            <li class="page-item"><a class="page-link" href="#">3</a></li>
                            <li class="page-item"><a class="page-link" href="#">4</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
